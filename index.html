<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9EEEC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F161A" media="(prefers-color-scheme: dark)">
<meta name="description" content="Huit casse-têtes de logique, 150 niveaux chacun, défis du jour et badges.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Grilles">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{overscroll-behavior:none}
body{margin:0;font-size:14px;font-family:system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Grilles du soir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: une colonne d'application centrée — accueil → niveaux → partie ; plateau centré, outils dessous */
:root{
  --bg:#E9EEEC; --surface:#FFFFFF; --ink:#15222A; --muted:#56686E; --line:#C5D0CD; --soft:#DCE4E1;
  --accent:#1E6E68; --accent-ink:#FFFFFF; --sun:#E09B26; --moon:#3B5DC2; --err:#C63F2C; --given:#DFE6E3; --gold:#D3941C;
  --r0:#F3C6B4;--r1:#BCD7F1;--r2:#CDE5B5;--r3:#F1DC9B;--r4:#D7C6ED;--r5:#B6E1DA;--r6:#F0BFD4;--r7:#D8D2C5;--r8:#C2C9F1;
  --f0:#DD4535;--f1:#2E6ED6;--f2:#2B9B4C;--f3:#E3AE17;--f4:#E57A1C;--f5:#8C4DC8;--f6:#14A3A3;--f7:#D6448B;--f8:#7A5132;--f9:#5E6B78;
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Atkinson Hyperlegible',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F161A; --surface:#18222A; --ink:#E4EBE9; --muted:#93A4A7; --line:#2D3B42; --soft:#212D34;
  --accent:#4DB2A8; --accent-ink:#0B1416; --sun:#F0B44A; --moon:#839EF2; --err:#F27762; --given:#24313A; --gold:#EFB64C;
  --r0:#6C4337;--r1:#2E4C6B;--r2:#3D5930;--r3:#685826;--r4:#4C3E6A;--r5:#22554F;--r6:#673A4F;--r7:#4B4841;--r8:#383F77;
  --f0:#F2665A;--f1:#5A92F0;--f2:#4CBC6C;--f3:#F2C443;--f4:#F29A45;--f5:#AC74E6;--f6:#36C4C4;--f7:#EE6AA8;--f8:#B0805A;--f9:#8C9AA8;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F161A; --surface:#18222A; --ink:#E4EBE9; --muted:#93A4A7; --line:#2D3B42; --soft:#212D34;
  --accent:#4DB2A8; --accent-ink:#0B1416; --sun:#F0B44A; --moon:#839EF2; --err:#F27762; --given:#24313A; --gold:#EFB64C;
  --r0:#6C4337;--r1:#2E4C6B;--r2:#3D5930;--r3:#685826;--r4:#4C3E6A;--r5:#22554F;--r6:#673A4F;--r7:#4B4841;--r8:#383F77;
  --f0:#F2665A;--f1:#5A92F0;--f2:#4CBC6C;--f3:#F2C443;--f4:#F29A45;--f5:#AC74E6;--f6:#36C4C4;--f7:#EE6AA8;--f8:#B0805A;--f9:#8C9AA8;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.app{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:18px 40px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.cell:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.num{font-variant-numeric:tabular-nums}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:42px;height:42px;display:grid;place-items:center;flex:none;padding:0}
.iconbtn svg{width:19px;height:19px}

/* Accueil */
.masthead{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;gap:10px;padding-bottom:18px;text-align:center}
.masthead h1{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.daily{background:var(--ink);color:var(--bg);border-radius:20px;padding:18px;display:grid;gap:14px;text-align:center}
.daily .eyebrow{color:inherit;opacity:.7}
.daily h2{font-size:22px}
.streakline{display:flex;justify-content:center;gap:6px;align-items:center;font-size:14px;opacity:.85}
.flame{width:16px;height:16px}
.daily-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dchip{border:0;background:color-mix(in srgb,var(--bg) 12%,transparent);border-radius:14px;padding:10px 2px 8px;display:grid;justify-items:center;align-content:center;gap:4px;font-size:12px;font-weight:700;color:var(--bg);min-width:0}
.dchip svg{width:32px;height:32px;display:block}
.dchip small{font-weight:400;font-size:11px;opacity:.75}
.dchip.done{background:var(--accent);color:var(--accent-ink)}
.section-title{display:flex;justify-content:space-between;align-items:baseline;margin:28px 0 10px}
.section-title h2{font-size:20px}
.games{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gtile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 12px 12px;display:grid;justify-items:center;text-align:center;gap:8px;min-width:0;position:relative}
.gtile .ico{width:56px;height:56px}
.gtile .ico svg{width:100%;height:100%;display:block}
.gtile h3{font-size:18px;line-height:1.15}
.gtile .meta{font-size:13px;color:var(--muted)}
.tierbar{width:100%;height:6px;border-radius:99px;background:var(--soft);overflow:hidden}
.tierbar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.gtile .actions{display:grid;gap:4px;width:100%;margin-top:2px}
.chip{position:absolute;top:10px;right:10px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--gold);color:#1a1205;border-radius:99px;padding:2px 7px}
.btn{border:0;border-radius:999px;padding:10px 14px;font-weight:700;font-size:14px;background:var(--soft)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.link{background:transparent;padding:6px;color:var(--muted);font-weight:700;font-size:13px}
.btn.danger{background:var(--err);color:var(--surface)}
.btn:disabled{opacity:.4;cursor:default}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{border:1px dashed var(--line);border-radius:14px;padding:12px 6px;display:grid;justify-items:center;align-content:start;text-align:center;gap:2px;font-size:12px;color:var(--muted);min-width:0}
.badge b{font-size:13px;color:var(--ink);font-family:var(--font-display)}
.badge .medal{width:34px;height:34px;margin-bottom:4px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:12px;color:var(--muted)}
.badge.on{border:1px solid var(--gold);background:color-mix(in srgb,var(--gold) 10%,var(--surface))}
.badge.on .medal{background:var(--gold);color:#1a1205}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat{background:var(--surface);border-radius:14px;padding:12px 6px;border:1px solid var(--line);text-align:center}
.stat b{font-family:var(--font-display);font-size:24px;display:block;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}

/* Partie */
.topbar{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:10px;margin-bottom:14px}
.topbar .t{min-width:0;text-align:center}
.topbar h2{font-size:22px;line-height:1.1}
.clock{display:grid;justify-items:end;gap:2px;min-width:64px}
.timer{font-family:var(--font-display);font-size:22px;font-weight:700;line-height:1}
.live{display:flex;gap:1px}
.live svg{width:13px;height:13px}
.stage{display:grid;justify-items:center}
.boardwrap{position:relative;width:min(100%,440px)}
#board{position:relative;width:100%;aspect-ratio:1;touch-action:none;user-select:none;-webkit-user-select:none}
.loading{position:absolute;inset:0;display:grid;place-items:center;border:3px dashed var(--line);border-radius:10px;color:var(--muted);font-weight:700}
.grid{position:absolute;inset:0;display:grid;border:3px solid var(--ink);border-radius:10px;overflow:hidden;background:var(--surface)}
.cell{position:relative;display:grid;place-items:center;border:0;padding:0;background:var(--surface);font-family:var(--font-display);font-weight:700;min-width:0;min-height:0}
.cell svg{width:62%;height:62%}
.cell.err{background-image:repeating-linear-gradient(45deg,color-mix(in srgb,var(--err) 30%,transparent) 0 4px,transparent 4px 9px)}
.cell .x{color:color-mix(in srgb,var(--ink) 55%,transparent);font-weight:500;font-size:1em;line-height:1}
.cell.auto::after{content:"";width:16%;aspect-ratio:1;border-radius:50%;background:color-mix(in srgb,var(--ink) 30%,transparent)}
.status{min-height:22px;margin-top:10px;font-size:14px;color:var(--muted);text-align:center}
.pausecover{position:absolute;inset:0;z-index:5;border-radius:10px;background:var(--surface);border:3px solid var(--ink);display:grid;place-items:center;align-content:center;gap:12px;text-align:center}
.pausecover h3{font-size:24px}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(100%,440px);margin-top:12px}
.tool{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 4px;display:grid;justify-items:center;gap:3px;font-size:12px;font-weight:700}
.tool svg{width:20px;height:20px}
.tool:disabled{opacity:.4;cursor:default}
.tool .cnt{color:var(--muted);font-weight:400}
.numpad{display:grid;gap:6px;width:min(100%,440px);margin-top:12px}
.digits{display:grid;gap:8px}
.digits button,.notebtn{border:1px solid var(--line);background:var(--surface);border-radius:16px;min-height:64px;font-family:var(--font-display);font-size:30px;font-weight:700;padding:0;min-width:0;touch-action:manipulation;box-shadow:0 2px 0 var(--line)}
.digits button:active{transform:translateY(2px);box-shadow:none;background:var(--soft)}
.digits .erase{font-size:16px;color:var(--muted);display:grid;place-items:center;gap:0}
.digits .erase svg{width:26px;height:26px}
.notebtn{min-height:52px;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.notebtn svg{width:20px;height:20px}
.notebtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:none}
.cons{position:absolute;transform:translate(-50%,-50%);width:7%;aspect-ratio:1;border-radius:50%;background:var(--surface);border:1.5px solid var(--ink);display:grid;place-items:center;font-weight:700;font-size:min(3.6vw,16px);line-height:1;z-index:2;pointer-events:none}
.cons.bad,.ineq.bad{background:var(--err);color:var(--surface);border-color:var(--err)}
.ineq{position:absolute;transform:translate(-50%,-50%);padding:0 2px;border-radius:5px;background:var(--surface);font-family:var(--font-display);font-weight:800;line-height:1;z-index:2;pointer-events:none;color:var(--ink)}
.zipsvg{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);pointer-events:none;z-index:1}
.dot{position:relative;z-index:2;width:58%;aspect-ratio:1;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-size:.9em}
.dot.hit{background:var(--accent);color:var(--accent-ink)}
.pip{position:relative;z-index:2;width:66%;aspect-ratio:1;border-radius:50%;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--ink) 25%,transparent)}
.sel{box-shadow:inset 0 0 0 3px var(--accent)}
.peer{background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.same{background:color-mix(in srgb,var(--accent) 22%,var(--surface))}
.given{background:var(--given)}
.sdk-user{color:var(--accent)}
.notes{display:grid;grid-template-columns:repeat(3,1fr);width:88%;height:80%;font-size:.34em;font-weight:500;color:var(--muted);font-family:var(--font-body)}
.notes span{display:grid;place-items:center}
.ngrid{position:absolute;inset:0;display:grid}
.ngrid .cell{background:var(--surface)}
.ngrid .cell.fill{background:var(--ink)}
.ngrid .cell.lock{background:var(--ink);box-shadow:inset 0 0 0 3px var(--accent)}
.clue{display:flex;gap:.35em;align-items:center;justify-content:flex-end;padding-right:.4em;font-family:var(--font-display);font-weight:700;color:var(--ink);line-height:1.05;min-width:0;min-height:0;overflow:hidden}
.clue.col{flex-direction:column;justify-content:flex-end;padding:0 0 .3em;gap:.1em}
.clue.done{color:color-mix(in srgb,var(--muted) 60%,transparent)}
.clue:nth-child(odd){background:color-mix(in srgb,var(--soft) 45%,transparent)}
.lamp{position:relative;border-radius:22%;margin:7%;background:var(--soft);border:0;padding:0;transition:background .12s}
.lamp.on{background:var(--sun);box-shadow:0 0 0 3px color-mix(in srgb,var(--sun) 35%,transparent)}
.lampgrid{position:absolute;inset:0;display:grid;border-radius:12px;background:var(--surface);border:3px solid var(--ink);padding:3%}
.howto{width:min(100%,440px);margin-top:16px;border-top:1px solid var(--line);padding-top:10px}
.howto summary{cursor:pointer;font-weight:700;font-size:14px;list-style:none;display:flex;justify-content:center;gap:6px;color:var(--muted)}
.howto summary::-webkit-details-marker{display:none}
.howto p{font-size:14px;color:var(--muted);margin:8px 0 0;text-align:center}

/* Niveaux */
.levelhead{text-align:center;display:grid;gap:10px;justify-items:center}
.levelhead .ico{width:64px;height:64px}
.levelhead .ico svg{width:100%;height:100%;display:block}
.levelhead p{font-size:14px;color:var(--muted);margin:0;max-width:42ch}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}
.lv{aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;align-content:center;gap:1px;font-family:var(--font-display);font-weight:700;font-size:18px;padding:0;min-width:0}
.lv small{font-size:10px;color:var(--gold);letter-spacing:1px;line-height:1.2}
.lv .bt{color:var(--muted);letter-spacing:0;font-family:var(--font-body);font-weight:400}
.lv.next{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lv.next small{color:inherit}
.lv:disabled{opacity:.32}
.tierhead{grid-column:1/-1;margin-top:16px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:1px solid var(--line);padding-bottom:6px}
.tierhead b{font-family:var(--font-display);font-size:16px}
.tierhead span{font-size:12px;color:var(--muted)}

/* Feuilles */
.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 55%,transparent);display:grid;place-items:center;padding:16px;z-index:20}
.card{background:var(--surface);border-radius:22px;padding:24px;width:min(100%,380px);text-align:center;display:grid;gap:12px;max-height:100%;overflow:auto}
.card h2{font-size:28px}
.stars{display:flex;justify-content:center;gap:6px}
.stars svg{width:46px;height:46px}
.card .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.newbest{display:inline-block;justify-self:center;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--gold);color:#1a1205;border-radius:99px;padding:3px 10px}
.setting{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;padding:10px 0;border-top:1px solid var(--line)}
.setting small{display:block;color:var(--muted);font-size:13px}
.switch{width:50px;height:30px;border-radius:99px;border:0;background:var(--soft);position:relative;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px color-mix(in srgb,var(--ink) 30%,transparent);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30;width:100%;height:100%}
@media (prefers-reduced-motion:no-preference){
  .stars svg{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
  .stars svg:nth-child(2){animation-delay:.12s}.stars svg:nth-child(3){animation-delay:.24s}
  @keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
}
.foot{font-size:12px;color:var(--muted);text-align:center;margin-top:28px}
</style>

</head>
<body>
<div class="app">
  <section id="home"></section>
  <section id="levelsView" hidden></section>
  <section id="play" hidden>
    <div class="topbar">
      <button class="iconbtn" id="backBtn" aria-label="Retour"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="t"><div class="eyebrow" id="pSub"></div><h2 id="pTitle"></h2></div>
      <div class="clock"><div class="timer num" id="timer">0:00</div><div class="live" id="live"></div></div>
    </div>
    <div class="stage">
      <div class="boardwrap">
        <div id="board"></div>
        <div class="pausecover" id="pauseCover" hidden><h3>En pause</h3><button class="btn primary" id="resumeBtn">Reprendre</button></div>
      </div>
      <div class="status num" id="status"></div>
      <div id="extra"></div>
      <div class="tools">
        <button class="tool" id="undoBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>Annuler</button>
        <button class="tool" id="resetBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Vider</button>
        <button class="tool" id="hintBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg><span>Indice <span class="cnt num" id="hintCnt"></span></span></button>
        <button class="tool" id="pauseBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 5v14M15 5v14"/></svg>Pause</button>
      </div>
      <details class="howto" id="howto"><summary>Comment jouer</summary><p id="rules"></p></details>
    </div>
  </section>
</div>
<div class="overlay" id="sheet" hidden><div class="card" id="sheetCard"></div></div>
<canvas id="confetti" hidden></canvas>

<script>
/* ---------- utilitaires ---------- */
const rngOf=seed=>{let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}};
const hash=s=>{let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
const shuffle=(a,r)=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const range=n=>[...Array(n).keys()];
const $=id=>document.getElementById(id);
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ymd(new Date());
const yesterday=()=>{const d=new Date();d.setDate(d.getDate()-1);return ymd(d)};
const LEVELS=150,PER=15;
const TIERS=['Initiation','Débutant','Facile','Apprenti','Intermédiaire','Confirmé','Avancé','Difficile','Expert','Maître'];
const tierOf=l=>Math.min(9,Math.floor((l-1)/PER));
const DAILY_TIER=5;

function placeQueens(n,r){const cols=[];const used=new Array(n).fill(false);
  const go=row=>{if(row===n)return true;for(const c of shuffle(range(n),r)){if(used[c])continue;if(row>0&&Math.abs(cols[row-1]-c)<2)continue;used[c]=true;cols[row]=c;if(go(row+1))return true;used[c]=false}return false};
  go(0);return cols}
function growRegions(n,cols,r){const reg=new Array(n*n).fill(-1);const act=[];
  cols.forEach((c,i)=>{reg[i*n+c]=i;act.push(i*n+c)});
  while(act.length){const k=Math.floor(r()*act.length),i=act[k];const nb=nbrs(n,i).filter(j=>reg[j]<0);
    if(!nb.length){act[k]=act[act.length-1];act.pop();continue}
    const j=nb[Math.floor(r()*nb.length)];reg[j]=reg[i];act.push(j)}
  return reg}

  const go=(row,cm,rm,prev)=>{if(row===n){cnt++;return}
    for(let c=0;c<n;c++){if(cm>>c&1)continue;if(prev>=0&&Math.abs(prev-c)<2)continue;const g=reg[row*n+c];if(rm>>g&1)continue;go(row+1,cm|1<<c,rm|1<<g,c);if(cnt>=limit)return}};
  go(0,0,0,-1);return cnt}

/* ---------- Sudoku (6×6 puis 9×9) ---------- */
const sbox=(p,i)=>{const n=p.n,y=i/n|0,x=i%n;return Math.floor(y/p.br)*(n/p.bc)+Math.floor(x/p.bc)};

 const go=()=>{let best=-1,bc=99,bm=0;
  for(let i=0;i<N;i++){if(g[i])continue;const used=R[i/n|0]|C[i%n]|B[bx[i]];let c=0;for(let v=1;v<=n;v++)if(!(used>>v&1))c++;if(c<bc){bc=c;best=i;bm=used;if(c<=1)break}}
  if(best<0){cnt++;if(!first)first=g.slice();return}if(bc===0)return;
  const y=best/n|0,x=best%n,b=bx[best];const vals=range(n).map(v=>v+1);if(r)shuffle(vals,r);
  for(const v of vals){const m=1<<v;if(bm&m)continue;g[best]=v;R[y]|=m;C[x]|=m;B[b]|=m;go();R[y]&=~m;C[x]&=~m;B[b]&=~m;g[best]=0;if(cnt>=limit)return}};
 go();return{cnt,first}}

/* ---------- Futoshiki ---------- */
function futoSolve(n,giv,ineq,limit){const N=n*n,g=giv.slice(),R=new Array(n).fill(0),C=new Array(n).fill(0);let cnt=0,first=null;
 const rel=Array.from({length:N},()=>[]);ineq.forEach(q=>{rel[q.a].push({o:q.b,lt:q.t==='<'});rel[q.b].push({o:q.a,lt:q.t!=='<'})});
 for(let i=0;i<N;i++)if(g[i]){R[i/n|0]|=1<<g[i];C[i%n]|=1<<g[i]}
 const cand=i=>{let m=0,c=0;const used=R[i/n|0]|C[i%n];
  for(let v=1;v<=n;v++){if(used>>v&1)continue;let ok=true;
   for(const r of rel[i]){const ov=g[r.o];if(ov?(r.lt?v>=ov:v<=ov):(r.lt?v===n:v===1)){ok=false;break}}
   if(ok){m|=1<<v;c++}}return[m,c]};

  for(let i=0;i<N;i++){if(g[i])continue;const[m,c]=cand(i);if(c<bc){bc=c;best=i;bm=m;if(c<=1)break}}
  if(best<0){cnt++;if(!first)first=g.slice();return}if(!bc)return;const y=best/n|0,x=best%n;
  for(let v=1;v<=n;v++){if(!(bm>>v&1))continue;const m=1<<v;g[best]=v;R[y]|=m;C[x]|=m;go();R[y]&=~m;C[x]&=~m;g[best]=0;if(cnt>=limit)return}};
 go();return{cnt,first}}

/* ---------- Nonogramme ---------- */
const clueOf=line=>{const o=[];let k=0;for(const v of line){if(v===1)k++;else if(k){o.push(k);k=0}}if(k)o.push(k);return o};
function solveLine(clue,line){const L=line.length,canF=new Array(L).fill(false),canE=new Array(L).fill(false),curr=new Array(L).fill(0);let any=false;
 const rest=[];for(let b=0;b<clue.length;b++){let s=0;for(let k=b+1;k<clue.length;k++)s+=clue[k]+1;rest.push(s)}
 const rec=(b,pos)=>{if(b===clue.length){for(let i=pos;i<L;i++){if(line[i]===1)return;curr[i]=0}any=true;for(let i=0;i<L;i++){if(curr[i])canF[i]=true;else canE[i]=true}return}
  const len=clue[b];
  for(let s=pos;s+len+rest[b]<=L;s++){if(s>pos&&line[s-1]===1)break;if(s>pos)curr[s-1]=0;
   let ok=true;for(let i=s;i<s+len;i++)if(line[i]===0){ok=false;break}
   if(ok&&s+len<L&&line[s+len]===1)ok=false;
   if(ok){for(let i=s;i<s+len;i++)curr[i]=1;if(s+len<L)curr[s+len]=0;rec(b+1,s+len+1)}}};
 rec(0,0);if(!any)return null;return line.map((v,i)=>canF[i]&&!canE[i]?1:canE[i]&&!canF[i]?0:v)}
function nonoSolve(n,rows,cols,fixed){const g=new Array(n*n).fill(-1);for(const i in fixed)g[i]=fixed[i];let changed=true;
 while(changed){changed=false;
  for(let y=0;y<n;y++){const line=g.slice(y*n,y*n+n);const nl=solveLine(rows[y],line);if(!nl)return null;for(let x=0;x<n;x++)if(nl[x]!==line[x]){g[y*n+x]=nl[x];changed=true}}
  for(let x=0;x<n;x++){const line=range(n).map(y=>g[y*n+x]);const nl=solveLine(cols[x],line);if(!nl)return null;for(let y=0;y<n;y++)if(nl[y]!==line[y]){g[y*n+x]=nl[y];changed=true}}}

  this.cut(st,j,c);pa.push(j);return true},
 hint(p,st){const c=range(p.k).find(c=>{const pa=st.paths[c],s=p.segs[c];return!(pa.length===s.length&&this.complete(p,pa,c)&&pa.every(i=>s.includes(i)))});

const Lights={key:'lights',name:'Lumières',short:'Lumières',icon:'lights',target:[15,20,30,40,50,60,75,90,110,130],
 rules:'Toucher une lampe inverse son état et celui de ses voisines directes (haut, bas, gauche, droite). Éteins toutes les lampes.',
 make(r,t){const n=[3,4,4,5,5,5,6,6,7,7][t],k=[3,4,6,6,8,10,11,13,15,18][t];let pr,on;
  do{pr=new Array(n*n).fill(0);shuffle(range(n*n),r).slice(0,k).forEach(i=>pr[i]=1);on=new Array(n*n).fill(0);
   pr.forEach((v,i)=>{if(v)[i,...nbrs(n,i)].forEach(j=>on[j]^=1)})}while(!on.some(v=>v));
  return{n,on,pr}},
 init(p){return{on:p.on.slice(),pr:new Array(p.n*p.n).fill(0),moves:0}},
 press(p,st,i){[i,...nbrs(p.n,i)].forEach(j=>st.on[j]^=1);st.pr[i]^=1;st.moves++},
 check(p,st){const lit=st.on.filter(v=>v).length;return{err:new Set(),won:!lit,status:`Lampes allumées : ${lit} · coups : ${st.moves}`}},
 render(el,p,st){const n=p.n;const g=document.createElement('div');g.className='lampgrid';g.style.gridTemplateColumns=`repeat(${n},1fr)`;g.style.gridTemplateRows=`repeat(${n},1fr)`;
  for(let i=0;i<n*n;i++){const b=document.createElement('button');b.className='lamp'+(st.on[i]?' on':'');b.setAttribute('aria-label',`Lampe ${i+1}, ${st.on[i]?'allumée':'éteinte'}`);
   b.onclick=()=>commit(s=>this.press(p,s,i));g.appendChild(b)}el.appendChild(g)},
 hint(p,st){const i=range(p.n*p.n).find(i=>p.pr[i]^st.pr[i]);if(i!==undefined)this.press(p,st,i)}
};

let drag=null;

const board=$('board');
function dragChanged(){if(!drag.pushed){cur.hist.push(drag.snap);drag.pushed=true}const res=draw();if(res.won){drag=null;finish()}}

 if(cur.G.up&&cur.G.up(cur.p,cur.st,d)){if(!d.pushed)cur.hist.push(d.snap);after()}else persist()});

 else if(e.key==='n'||e.key==='N')NumGame.toggleNotes();
 else{const d={ArrowLeft:-1,ArrowRight:1,ArrowUp:-n,ArrowDown:n}[e.key];if(d){const s=cur.st.sel<0?0:cur.st.sel;const m=s+d;if(m>=0&&m<n*n){cur.st.sel=m;draw();e.preventDefault()}}}});

/* confettis */
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const cv=$('confetti');cv.hidden=false;
 const dpr=devicePixelRatio||1;cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
 const cs=getComputedStyle(document.documentElement);const cols=['--accent','--sun','--moon','--gold','--f0','--f7'].map(v=>cs.getPropertyValue(v).trim());
 const ps=Array.from({length:140},()=>({x:innerWidth/2,y:innerHeight*.42,vx:(Math.random()-.5)*12,vy:-Math.random()*13-3,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.4,w:6+Math.random()*6,h:4+Math.random()*4,c:cols[Math.floor(Math.random()*cols.length)]}));
 const t0=performance.now();const step=t=>{const k=(t-t0)/1600;ctx.clearRect(0,0,innerWidth,innerHeight);
  for(const p of ps){p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.globalAlpha=Math.max(0,1-k);ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()}
  if(k<1)requestAnimationFrame(step);else cv.hidden=true};requestAnimationFrame(step)}

/* fin de partie */
const STREAK_MIN=4;
function finish(){cur.done=true;stopClock();clearInterval(tick);updTimer();draw();const secs=elapsed();const T=cur.G.target[cur.t];
 const stars=starsFor(secs,cur.hints,T);delete S.saved[cur.id];
 S.solved++;if(secs<=15)S.flags.eclair=true;if(cur.t===9&&stars===3&&!cur.daily&&!S.set.zen)S.flags.perfect=true;
 let msg='',best=false;
 if(cur.daily){if(S.daily.date!==today())S.daily={date:today(),done:{}};S.daily.done[cur.key]=true;
  const nd=ORDER.filter(k=>S.daily.done[k]).length;if(nd>=4)S.flags.quatuor=true;if(nd===ORDER.length)S.flags.chelem=true;
  if(nd>=STREAK_MIN&&S.streak.last!==today()){S.streak.n=S.streak.last===yesterday()?S.streak.n+1:1;S.streak.last=today();S.flags.best=Math.max(S.flags.best||0,S.streak.n);
   msg=`Journée validée : série de ${S.streak.n} jour${S.streak.n>1?'s':''}.`}
  else if(nd<STREAK_MIN)msg=`Encore ${STREAK_MIN-nd} défi${STREAK_MIN-nd>1?'s':''} pour valider la journée.`;
  else msg=nd===ORDER.length?'Les huit défis du jour sont faits.':`${nd} défis sur ${ORDER.length} aujourd'hui.`}
 else{const rec=S.p[cur.key];const prev=rec.best[cur.level];best=prev!==undefined&&secs<prev;
  rec.stars[cur.level]=Math.max(rec.stars[cur.level]||0,stars);rec.best[cur.level]=Math.min(prev??1e9,secs);
  if(cur.level>=rec.level)rec.level=cur.level+1;
  msg=cur.hints?`${cur.hints} indice${cur.hints>1?'s':''} utilisé${cur.hints>1?'s':''}.`:S.set.zen?'Mode zen : le temps ne compte pas.':secs>T?`Objectif 3 étoiles : ${fmt(T)}.`:'Sous l\'objectif de temps.';
  if(cur.level===LEVELS)msg+=' Tu as terminé les 150 niveaux ! Les suivants sont des grilles Maître en bonus.';
  else if(tierOf(cur.level+1)>cur.t)msg+=` Palier ${TIERS[tierOf(cur.level+1)]} débloqué.`}
 save();try{if(S.set.vibe&&navigator.vibrate)navigator.vibrate([30,50,70])}catch(e){}
 const k=cur.key,l=cur.level,daily=cur.daily;
 const nextDaily=daily?ORDER.find(g=>!dailyDone()[g]):null;

  <div class="row">${daily?(nextDaily?`<button class="btn primary" id="wNextD">Défi suivant : ${GAMES[nextDaily].short}</button>`:'')+'<button class="btn ghost" id="wHome">Accueil</button>':'<button class="btn primary" id="wNext">Niveau suivant</button><button class="btn ghost" id="wHome">Accueil</button>'}
  <button class="btn link" id="wView">Voir la grille</button></div>`,450,()=>{

  $('wView').onclick=()=>{$('sheet').hidden=true}});

 <div class="section-title"><h2>Badges</h2><span class="eyebrow num">${badges.filter(b=>b[3]).length} / ${badges.length}</span></div>
 <div class="badges">${badges.map(([m,t,s,on])=>`<div class="badge${on?' on':''}"><div class="medal">${m}</div><b>${t}</b><span>${s}</span></div>`).join('')}</div>
 <div class="stats"><div class="stat"><b class="num">${S.solved}</b><span>grilles résolues</span></div><div class="stat"><b class="num">${ORDER.reduce((a,k)=>a+totalStars(k),0)}</b><span>étoiles</span></div><div class="stat"><b class="num">${S.flags.best||0}</b><span>meilleure série</span></div></div>
 <p class="foot">Ta progression et tes parties en cours restent dans ce navigateur, sur cet appareil.</p>`;
 $('setBtn').onclick=openSettings;
 $('home').querySelectorAll('[data-daily]').forEach(b=>b.onclick=()=>start(b.dataset.daily,0,true));
 $('home').querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>start(b.dataset.play,S.p[b.dataset.play].level,false));
 $('home').querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>openLevels(b.dataset.lv));
 show('home')}
function openLevels(k){const rec=S.p[k],G=GAMES[k];const max=Math.max(LEVELS,rec.level);let html='';
 for(let l=1;l<=max;l++){
  if(l>LEVELS&&l===LEVELS+1)html+=`<div class="tierhead"><b>Bonus</b><span>grilles Maître sans fin</span></div>`;
  else if(l<=LEVELS&&(l-1)%PER===0){const t=tierOf(l);let s=0;for(let m=l;m<l+PER;m++)s+=rec.stars[m]||0;
   html+=`<div class="tierhead"><b>${t+1}. ${TIERS[t]}</b><span class="num">niveaux ${l}–${l+PER-1} · ${s} / ${PER*3} ★</span></div>`}
  const s=rec.stars[l]||0,b=rec.best[l];const locked=l>rec.level;
  html+=`<button class="lv${l===rec.level?' next':''}" data-l="${l}" ${locked?'disabled aria-label="Niveau '+l+' verrouillé"':''}><span class="num">${l}</span><small>${s?'★'.repeat(s):l===rec.level?'à jouer':'&nbsp;'}</small>${b!==undefined?`<small class="bt num">${fmt(b)}</small>`:''}</button>`}
 const going=S.saved[idOf(k,rec.level,false)];
 $('levelsView').innerHTML=`<div class="topbar"><button class="iconbtn" id="lvBack" aria-label="Retour">${BACK}</button>
  <div class="t"><div class="eyebrow num">${Math.min(rec.level-1,LEVELS)} / ${LEVELS} · ${totalStars(k)} ★</div><h2>${G.name}</h2></div><span style="width:42px"></span></div>
  <div class="levelhead"><div class="ico">${ICONS[G.icon]}</div><p>${G.rules}</p>
  <button class="btn primary" id="lvGo">${going?'Reprendre':'Continuer'} · niveau ${rec.level}</button></div>
  <div class="levels">${html}</div>`;
 $('lvBack').onclick=renderHome;$('lvGo').onclick=()=>start(k,rec.level,false);
 $('levelsView').querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>start(k,+b.dataset.l,false));show('levelsView');
 const nx=$('levelsView').querySelector('.lv.next');if(nx&&rec.level>10)nx.scrollIntoView({block:'center'})}
renderHome();
</script>

<script>
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
